name: Production Build Verification

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-production:
    name: Build & Validate Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Clean Dependencies
        run: npm ci

      - name: 🏗️ Compile Production Bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📦 Archive Production Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebda-edu-dist
          path: dist/
          retention-days: 7
