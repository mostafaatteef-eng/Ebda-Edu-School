    <script>
      (function() {
        try {
          var targetWindow = typeof window !== 'undefined' ? window : typeof globalThis !== 'undefined' ? globalThis : null;
          if (!targetWindow) return;
          var originalFetch = targetWindow.fetch ? targetWindow.fetch.bind(targetWindow) : undefined;
          var currentFetch = originalFetch;

          function defineFetchOn(obj) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          defineFetchOn(targetWindow);
          if (targetWindow.Window && targetWindow.Window.prototype) {
            defineFetchOn(targetWindow.Window.prototype);
          }
        } catch (err) {}
      })();
    </script>
