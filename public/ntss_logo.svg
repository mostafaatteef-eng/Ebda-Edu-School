<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <!-- Background transparent -->
  <g fill="#00908E">
    <!-- NTSS Typography -->
    <text x="30" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" letter-spacing="-2px">NTSS</text>
    <text x="32" y="155" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="1px">NATIONAL TECHNICAL</text>
    <text x="32" y="185" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="1px">SCIENCE SCHOOLS</text>
    <text x="32" y="235" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="28" direction="rtl">المدارس الوطنية للعلوم التقنية</text>
    
    <!-- Emblem (Right Side) -->
    <g transform="translate(360, 30)">
      <!-- Top Center Vertical Ray -->
      <rect x="105" y="10" width="22" height="65" />
      
      <!-- Top Left Diagonal Ray (-45 deg) -->
      <polygon points="50,26 67,9 116,58 99,75" />
      
      <!-- Top Right Diagonal Ray (+45 deg) -->
      <polygon points="182,26 165,9 116,58 133,75" />
      
      <!-- Middle Horizontal Bar -->
      <rect x="25" y="75" width="182" height="24" />
      
      <!-- Bottom Semicircle Arc -->
      <path d="M 40 118 A 76 76 0 0 0 192 118" fill="none" stroke="#00908E" stroke-width="24" stroke-linecap="butt" />
    </g>
  </g>
</svg>
